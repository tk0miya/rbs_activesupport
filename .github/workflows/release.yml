name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'lib/rbs_activesupport/version.rb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: ruby
          # Skip bundler cache to avoid the cache-poisoning attack at release time:
          # a poisoned cache written from a PR could otherwise be reused here
          # and end up shipped to RubyGems.
          # See https://docs.zizmor.sh/audits/#cache-poisoning
          bundler-cache: false
      - name: Install dependencies
        run: bundle install
      - name: Publish to RubyGems
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
